<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Live Translate</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header><h1>Live Translate</h1><span id="monitor" data-state="idle">Bereit</span></header>
  <main>
    <section class="mix-panel" aria-label="Audioausgabe">
      <div class="voice"><select id="liveVoice" aria-label="Deutsche Stimme"></select></div>
      <label class="language-row" for="sourceLanguage"><span>Quelle</span>
        <select id="sourceLanguage" aria-label="Quellsprache">
          <option value="en">Englisch</option>
          <option value="auto">Alle Sprachen</option>
        </select>
      </label>
      <label class="volume-label" for="translationVolume"><span>Deutsch</span><output id="translationValue" for="translationVolume">100 %</output></label>
      <input type="range" id="translationVolume" min="0" max="100" step="5" value="100" aria-label="Lautstärke der deutschen Stimme" />
      <label class="volume-label" for="originalVolume"><span>Original</span><output id="originalValue" for="originalVolume">100 %</output></label>
      <input type="range" id="originalVolume" min="0" max="100" step="5" value="100" aria-label="Lautstärke des Originaltons" />
      <p class="hint">Das Original wird automatisch leiser, solange Deutsch spricht. Player-Lautstärke auf 100 % lassen.</p>
    </section>
    <section class="subtitles" aria-label="Untertitel">
      <label class="switch-row"><span>Untertitel</span><input type="checkbox" id="subtitles" role="switch" /><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row secondary"><span>+ Original</span><input type="checkbox" id="dualSubtitles" role="switch" /><span class="switch" aria-hidden="true"></span></label>
    </section>
    <details id="connection"><summary>Einstellungen <span id="serverState" data-state="unknown"></span></summary><div class="connection-fields">
      <label for="liveServerUrl">Server-URL</label><input type="url" id="liveServerUrl" placeholder="http://127.0.0.1:8787" autocomplete="url" spellcheck="false" />
      <label for="liveServerToken">Server-Zugriffstoken</label><input type="password" id="liveServerToken" placeholder="Lokaler Server-Token" autocomplete="off" />
    </div></details>
  </main>
  <footer>
    <button id="toggle" type="button" aria-pressed="false" disabled>…</button>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="tabInfo"></div>
    <div id="liveStats" aria-live="off"></div>
    <div id="shortcut"></div>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
